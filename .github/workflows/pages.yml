name: Publish playable preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage browser files only
        run: |
          mkdir _site
          cp history.html history.js _site/
          cp ce_stage_palettes_data.js ce_stage_palettes.js _site/
          cp ce_stage_boat_data.js ce_stage_boat.js ce_stage_cyclists_data.js ce_stage_cyclists.js _site/
          cp ce_stage_birds_data.js ce_stage_birds.js _site/
          cp ce_round_data.js ce_round.js ce_winner_data.js ce_winner.js _site/
          cp ce_camera_data.js ce_camera.js _site/
          cp ce_stage_water_data.js ce_stage_spray_data.js ce_stage_water.js _site/
          cp ce_stage_animations_data.js ce_stage_animations.js ce_stage_scroll_data.js ce_stage_scroll.js ce_stage_dancers_data.js ce_stage_dancers.js _site/
          cp ce_projectile_clash.js ce_projectile_clash_data.js _site/
          cp ce_barrel_data.js ce_barrels.js ce_barrel_player_data.js ce_barrel_player.js _site/
          cp ce_combat_data.js ce_combat.js ce_cpu_handicap.js ce_reactions_data.js ce_reactions.js ce_dizzy_data.js ce_dizzy_core.js ce_objects.js ce_dizzy.js ce_special_reactions_data.js ce_special_reactions.js _site/
          cp index.html game.js assets.js assets_ce.js sound.js music.js font.js screens.js screens_ce.js endings.js endings_ce.js projectiles_ce.js victory_ce.js shadows_ce.js ce_specials.js ce_bison.js ce_bison_input.js ce_shoto_input.js ce_guile_input.js ce_charge_specials.js ce_bison_throw.js ce_chun_throw.js ce_honda_hands_data.js ce_honda_hands.js ce_honda_hold.js ce_honda_hold_data.js ce_dhalsim_data.js ce_dhalsim.js ce_chun_legs.js ce_chun_air.js ce_zangief.js ce_blanka_bite.js ce_normals.js ce_ryu_stage.js ce_car.js ce_car_assets.js ce_announcer.js ce_presentation.js world_map_ce.js ce_world_map.js lobby.html lobby.css netplay.js ai_rules.js ai_colors.js ai_portraits.js ai_portraits_data.js ai_weather.js ai_roster.js ai_evil_ken.js ai_evil_ken_data.js graphics_filter.js ce_shoto_throw.js ce_vega_ground_data.js ce_vega.js vega_claw_ce.js ce_vega_claw.js input_ui.js build.json .nojekyll _site/
          cp ai_damnd_data.js ai_damnd.js ai_reels_data.js ai_shadows.js ai_scene.js ai_atmosphere.js ai_stage_materials.js _site/
          mkdir -p _site/ai-effects
          cp ai-effects/particles-lights.png ai-effects/ryu-skies.png ai-effects/room-extensions.png ai-effects/ryu-roof.png ai-effects/ryu-crest.png ai-effects/cherry-petals.png ai-effects/rose-petals.png ai-effects/cloud-mist.png ai-effects/cloud-bank.png ai-effects/mist-bank.png ai-effects/india-wall.png ai-effects/india-native-top.png ai-effects/china-foreground.png ai-effects/china-far.png _site/ai-effects/
          mkdir -p _site/ai
          cp ai/index.html ai/edition.json _site/ai/
      - id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # Use the upload output directly: the artifact listing service can lag
      # behind a successful upload, causing deploy-pages to find zero artifacts.
      - id: deploy
        name: Deploy uploaded Pages artifact
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Pages upload did not return a valid artifact ID');
            }
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            // Artifact metadata can become visible before Pages can read its content.
            await wait(15000);
            for (let publish = 0; publish < 3; publish++) {
              const oidcToken = await core.getIDToken();
              core.setSecret(oidcToken);
              const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken
              });
              core.setOutput('page_url', deployment.page_url);
              let retry = false;
              for (let attempt = 0; attempt < 120; attempt++) {
                await wait(5000);
                const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                  ...context.repo,
                  deployment_id: deployment.id
                });
                if (data.status === 'succeed') {
                  core.info('Pages deployment succeeded');
                  return;
                }
                if (['deployment_failed', 'deployment_lost'].includes(data.status) && publish < 2) {
                  core.warning('Pages deployment failed; retrying the uploaded artifact');
                  retry = true;
                  break;
                }
                if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_artifact_expired'].includes(data.status)) {
                  throw new Error('Pages deployment failed: ' + data.status);
                }
              }
              if (!retry) throw new Error('Timed out waiting for Pages deployment');
              await wait(10000);
            }
